name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, bcmath, gd, zip, exif, pcntl, pdo_sqlite
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Copy .env
              run: cp .env.example .env

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Install Node dependencies
              run: npm ci

            - name: Build frontend assets
              run: npm run build

            - name: Generate application key
              run: php artisan key:generate

            - name: Create SQLite database
              run: touch database/database.sqlite

            - name: Run migrations
              run: php artisan migrate --force

            - name: Run tests
              run: php artisan test

            - name: Seed a completed analysis for browser checks
              run: |
                  mkdir -p storage/app/private/cv-uploads
                  cp public/samples/sample-cv.pdf storage/app/private/cv-uploads/browser-check.pdf
                  cat <<'PHP' | php artisan tinker
                  App\Models\CvAnalysis::updateOrCreate(
                      ['id' => '01ARZ3NDEKTSV4RRFFQ69G5FAV'],
                      [
                          'original_filename' => 'sample-cv.pdf',
                          'file_path' => 'cv-uploads/browser-check.pdf',
                          'status' => App\Enums\CvAnalysisStatus::Completed,
                          'result' => [
                              'score' => 72,
                              'summary' => 'Accessibility check fixture.',
                              'sections' => [['name' => 'Format', 'severity' => 'ok', 'feedback' => 'Looks fine.']],
                              'missing_keywords' => ['Docker'],
                              'bullet_rewrites' => [['original' => 'Before', 'improved' => 'After', 'reason' => 'Why']],
                          ],
                      ]
                  );
                  PHP

            # PHP_CLI_SERVER_WORKERS + --no-reload: php artisan serve defaults
            # to a single worker, so only one HTTP request can be in flight
            # at a time. That single-threadedness is the likely real cause of
            # an earlier mystery here (Lighthouse's Chrome got a genuine 404
            # on a URL puppeteer had just loaded fine moments earlier in the
            # same job) - matches the same production concurrency bug this
            # fixed in the Dockerfile.
            - name: Start server for browser checks
              env:
                  PHP_CLI_SERVER_WORKERS: 4
              run: php artisan serve --port=8000 --no-reload &

            - name: Wait for server
              run: npx wait-on http://127.0.0.1:8000

            - name: Run accessibility checks (axe-core)
              env:
                  A11Y_BASE_URL: http://127.0.0.1:8000
                  A11Y_ANALYSIS_ID: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run: |
                  export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
                  npm run a11y

            - name: Run end-to-end smoke test (upload -> results page)
              env:
                  E2E_BASE_URL: http://127.0.0.1:8000
              run: |
                  export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
                  npm run e2e

            # Re-includes the results page: the earlier 404-on-the-fixture
            # mystery here was almost certainly the single-worker dev server
            # above, now fixed with PHP_CLI_SERVER_WORKERS.
            - name: Run Lighthouse CI (performance, accessibility, best practices, SEO)
              run: |
                  export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
                  npx lhci autorun \
                      --collect.url=http://127.0.0.1:8000/ \
                      --collect.url=http://127.0.0.1:8000/cv-analyses/01ARZ3NDEKTSV4RRFFQ69G5FAV
